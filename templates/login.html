{% extends "base.html" %}
{% block title %}Sign In{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-left">
    <h2>Welcome back.</h2>
    <p>Sign in to post on the forum and access your profile.</p>
    <div class="auth-hint">
      <span class="mono">Hint:</span> The login system may not be as solid as it looks.
    </div>
  </div>

  <div class="auth-right">
    <div class="form-card">
      <h3>Sign in</h3>
      {% if error %}
        <div class="alert">{{ error }}</div>
      {% endif %}
      <form method="POST">
        <div class="field">
          <label>Username</label>
          <input type="text" name="username" placeholder="your username" autocomplete="off" required/>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" placeholder="your password" required/>
        </div>
        <button type="submit" class="btn-primary full">Sign in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
